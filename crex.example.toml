#  CREX 설정 예시
#
#  이 파일을 `crex.toml` 로 복사해 쓴다. CREX 는 워크스페이스 안을 먼저 보고,
#  없으면 현재 디렉터리부터 위로 올라가며 `crex.toml` 또는 `.crex.toml` 을 찾는다.

# --------------------------------------------------------------------------
# 워크스페이스 (리뷰 대상 저장소)
# --------------------------------------------------------------------------
#  CREX 를 리뷰 대상 저장소 안에 둘 필요는 없다. 설치본은 한 자리에 두고
#  (= 반입본이 하나뿐이라 무결성 관리가 된다) 대상만 지정한다.
#
#      cd D:\tools\crex
#      python -m crex review --workspace D:\work\myrepo --staged
#
#  매번 치기 싫으면 여기에 적는다. 우선순위는
#      --workspace > CREX_WORKSPACE(또는 CREX_REPO) > 아래 값 > 현재 디렉터리
#  상대경로는 **이 설정 파일이 있는 디렉터리** 기준이다.
#
# workspace = "D:/work/myrepo"

# --------------------------------------------------------------------------
# LLM 엔드포인트
# --------------------------------------------------------------------------
#  생성과 검증에 서로 다른 모델을 쓰는 것이 핵심이다. 같은 모델의 자기검증보다
#  교차 모델 검증이 환각을 훨씬 잘 잡는다. vLLM 인스턴스를 두 개 띄우고
#  검증 쪽에 GPU 를 적게 배분하면 된다 — 검증은 입력이 짧고 출력이 한 토큰이다.

[llm.generator]
base_url = "http://vllm-qwen:8000/v1"
model = "Qwen3.6-27B"
api_key = "EMPTY"                  # vLLM 은 보통 인증이 없다
temperature = 0.0                  # 리뷰는 재현 가능해야 한다. 절대 올리지 말 것.
max_output_tokens = 900

#  입력 상한. 256K 컨텍스트가 있어도 쓰지 않는다 — 컨텍스트를 늘릴수록 정밀도가
#  떨어진다는 것이 반복 확인된 결과다. 8192 를 기본으로 두고, 올리기 전에
#  반드시 골든셋으로 FAR 변화를 측정하라.
max_input_tokens = 8192

timeout = 120.0
max_retries = 3

#  vLLM 버전에 따라 구조화 출력 전달 방식이 다르다.
#    "auto"            — 되는 쪽을 스스로 찾는다 (기본값, 권장)
#    "response_format" — 최신 vLLM 로 고정
#    "guided_json"     — 구버전 vLLM 로 고정
#  "auto" 는 첫 호출에서 response_format → guided_json 순으로 시도하고, 성공한
#  방식을 기억해 이후 호출에 바로 쓴다. 서버 버전을 몰라도 되므로 그대로 두면 된다.
structured_output_mode = "auto"

#  guided_json 경로에서 함께 보낼 백엔드 이름. 비우면 보내지 않는다.
#  최신 vLLM 은 이 필드를 모르는 키로 보고 400 을 돌려주므로 기본은 비워둔다.
#  구버전에서 백엔드를 명시해야 할 때만 "xgrammar" 등을 적는다.
# guided_decoding_backend = "xgrammar"

#  Qwen3.x 계열의 추론 모드를 끈다. 리뷰는 고정 단계이므로 사고 과정이 불필요하고,
#  켜두면 지연시간만 몇 배로 늘어난다.
[llm.generator.extra_body]
chat_template_kwargs = { enable_thinking = false }

[llm.verifier]
base_url = "http://vllm-gemma:8000/v1"
model = "gemma-4-31b-it"
api_key = "EMPTY"
temperature = 0.0
max_input_tokens = 4096            # 검증은 청크 하나만 보므로 더 좁게 잡는다
timeout = 60.0
structured_output_mode = "auto"

# --------------------------------------------------------------------------
# 리뷰 동작
# --------------------------------------------------------------------------

[review]
mode = "native"                    # 현재 "native" 만 구현되어 있다. 다른 값을 넣으면 오류.
max_findings_per_chunk = 5         # 청크당 지적 상한. 모델이 흩뿌리는 것을 막는다.
max_workers = 4                    # 동시 LLM 호출 수. vLLM 의 배치 처리량에 맞춰 조정.
require_changed_line = true        # diff 리뷰에서는 변경된 라인만 지적 대상

#  이 심각도 미만은 리포트에서 숨긴다. 기각과는 다르다 — 유효하다고 판정된
#  지적을 "지금은 보고 싶지 않다"고 감추는 것이다.
#
#  도입 초기에는 "high" 로 시작하기를 권한다. 처음 두어 주는 명백한 버그만
#  보여주며 신뢰를 쌓고, "이 도구 말이 맞네"라는 인식이 생기면 "medium" 으로
#  낮춘다. 처음부터 전부 보여주면 노이즈에 묻혀 진짜 지적까지 무시당한다.
min_severity = "low"

# --------------------------------------------------------------------------
# 정적분석 그라운딩
# --------------------------------------------------------------------------
#  LLM 을 부르기 전에 결정론적 도구를 돌려 사실을 확보한다. 없는 도구는 조용히
#  건너뛴다. `python -m crex doctor` 로 무엇이 설치되어 있는지 확인하라.

[grounding]
enabled = true
timeout = 120.0

#  C++: compile_commands.json 이 있는 디렉터리. 없으면 clang-tidy 가 헤더를
#  못 찾아 정확도가 크게 떨어진다. 손으로 적지 말고 만들게 하라 —
#  CMake·MSBuild 를 알아서 처리하고 이 값까지 적어준다:
#    python -m crex compiledb
compile_commands_dir = "build"

#  C#: 빌드할 솔루션/프로젝트. Roslyn 분석기 경고를 그대로 수확한다.
#  비워두면 바뀐 파일이 속한 .csproj 를 찾아 그것만 빌드한다. 여러 프로젝트에
#  걸쳐 있으면 .sln 으로 올린다. 자동으로 못 정할 때만 적으면 된다.
dotnet_project = "src/App.sln"

#  clang-tidy 체크 목록. 비워두는 것이 기본이자 권장이다.
#  비우면 프로젝트의 .clang-tidy 를 존중하고(= 팀 코딩 룰이 살아난다),
#  그것도 없으면 버그 탐지 위주 기본값을 쓴다. 지정하면 그것이 이긴다.
# clang_tidy_checks = "-*,bugprone-*,cert-*"

#  Semgrep: 폐쇄망에서 "auto" 는 동작하지 않는다 (룰을 인터넷에서 받아온다).
#  룰팩을 사전에 반입하고 로컬 경로를 지정해야 한다. 미지정 시 semgrep 은
#  아예 실행되지 않는다.
# semgrep_config = "/opt/semgrep-rules"

#  특정 분석기만 쓰려면 이름을 나열한다. 비우면 기본 6종
#  (clang-tidy, cppcheck, roslyn, ruff, mypy, bandit)이 전부 돈다.
#
#  roslynator 와 semgrep 은 기본에서 빠져 있다. 쓰려면 이름을 적어야 한다.
#  (semgrep 은 semgrep_config 가 있으면 이름 없이도 켜진다)
#  이름을 틀리면 오류가 난다 — 조용히 넘어가면 기본 분석기까지 전부 걸러진다.
# analyzers = ["cppcheck", "ruff"]

# --------------------------------------------------------------------------
# 청킹
# --------------------------------------------------------------------------

[chunking]
#  hunk 를 함수 경계까지 확장하되, 원본의 4배를 넘으면 3배로 절단한다.
#  거대 함수 하나가 컨텍스트를 통째로 먹는 것을 막는 장치다.
expansion_limit = 4.0
expansion_truncate = 3.0
absolute_max_lines = 400

#  diff 와 디스크 파일이 어긋날 때의 동작.
#    "raise"  — 해당 파일을 건너뛴다 (권장). 라인 번호가 밀린 리뷰는 전부 거짓말이다.
#    "warn"   — 경고만 남기고 진행
#    "ignore" — 검사하지 않음
on_mismatch = "raise"

# --------------------------------------------------------------------------
# 룰 택소노미
# --------------------------------------------------------------------------
#  미지정 시 rules/taxonomy.toml 을 쓴다.
# taxonomy_path = "rules/taxonomy.toml"
